services:
  api:
    build: .
    container_name: visionops-api
    ports:
      - "8001:8000"
    volumes:
      - ./artifacts:/app/artifacts

  prometheus:
    image: prom/prometheus:latest
    container_name: visionops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: visionops-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.0
    container_name: visionops-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

volumes:
  prometheus-data:
  grafana-data:
  mlflow-data:
