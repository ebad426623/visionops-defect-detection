stages:
  prepare:
    cmd: python -m src.data.prepare
    deps:
    - data/raw
    - src/data/prepare.py
    params:
    - data
    - project
    outs:
    - data/processed
  train:
    cmd: python -m src.training.train
    deps:
    - data/processed
    - src/data/dataset.py
    - src/models/classifier.py
    - src/training/train.py
    params:
    - data
    - mlflow
    - training
    outs:
    - artifacts/best_model.pt
  evaluate:
    cmd: python -m src.evaluation.evaluate
    deps:
    - artifacts/best_model.pt
    - data/processed
    - src/data/dataset.py
    - src/evaluation/evaluate.py
    - src/models/classifier.py
    params:
    - data
    - training
    outs:
    - artifacts/metrics.json
  quality_gate:
    cmd: python -m src.evaluation.quality_gate
    deps:
    - artifacts/metrics.json
    - src/evaluation/quality_gate.py
    params:
    - evaluation
  register:
    cmd: python -m src.registry.register
    deps:
    - artifacts/best_model.pt
    - artifacts/metrics.json
    - src/models/classifier.py
    - src/registry/register.py
    params:
    - mlflow
  promote:
    cmd: python -m src.registry.promote
    deps:
    - src/registry/promote.py
    params:
    - mlflow
  simulate_drift:
    cmd: python -m scripts.simulate_drift
    deps:
    - data/processed/test
    - scripts/simulate_drift.py
    outs:
    - data/production/drifted
  drift_report:
    cmd: python -m src.monitoring.drift --last-n 180
    deps:
    - artifacts/predictions.jsonl
    - src/monitoring/drift.py
    outs:
    - artifacts/drift_report.json
